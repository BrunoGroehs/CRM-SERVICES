version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: crm-services-prod
    ports:
      - "80:3000" # Mapeia a porta 80 da VPS para a 3000 do container
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
