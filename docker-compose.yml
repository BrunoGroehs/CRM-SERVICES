version: '3.8'

services:
  backend:
    build: .
    container_name: crm-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend/crm-frontend
    container_name: crm-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true # Fix for hot reload on Windows
      - WDS_SOCKET_PORT=0 # Fix for websocket connection
    volumes:
      - ./frontend/crm-frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend
    restart: unless-stopped
